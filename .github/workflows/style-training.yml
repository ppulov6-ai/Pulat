name: Обучение стиля ответов
on:
  push:
    paths:
      - 'Стиль_ответов/run.py'
      - 'Стиль_ответов/train.json'
      - 'Стиль_ответов/test.json'
      - '.github/workflows/style-training.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Зависимости CPU
        working-directory: Стиль_ответов
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Дообучение и контрольные ответы
        working-directory: Стиль_ответов
        env:
          HF_HUB_DISABLE_XET: '1'
        run: python -u run.py
      - uses: actions/upload-artifact@v4
        with:
          name: russian-style-lora
          path: Стиль_ответов/result
          if-no-files-found: error
