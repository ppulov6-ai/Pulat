name: Проверка уточняющих вопросов
on:
  push:
    paths:
      - 'Стиль_ответов/v2/train.json'
      - 'Стиль_ответов/v2/test.tsv'
      - 'Стиль_ответов/v2/test.json'
      - 'Стиль_ответов/v2/compare.py'
      - '.github/workflows/style-questions.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Зависимости CPU
        working-directory: Стиль_ответов
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Дообучение и контрольные ответы
        working-directory: Стиль_ответов
        env:
          HF_HUB_DISABLE_XET: '1'
        run: |
          cd v2
          python -u ../run.py
      - name: Восстановить опубликованные веса первой версии
        id: restore
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: russian-style-lora
          run-id: 44563768823
          github-token: ${{ github.token }}
          path: old-result
      - name: Воспроизвести первую версию при истечении срока архива
        if: steps.restore.outcome == 'failure'
        working-directory: Стиль_ответов
        run: |
          python run.py
          mv result ../old-result
      - name: Сравнить модели на одинаковых заявках
        working-directory: Стиль_ответов/v2
        run: python -u compare.py ../../old-result/adapter
      - uses: actions/upload-artifact@v4
        with:
          name: style-questions-v2
          path: Стиль_ответов/v2/result
          if-no-files-found: error
