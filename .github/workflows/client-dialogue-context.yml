name: Проверка контекста в диалогах с заказчиками
on:
  push:
    paths:
      - 'Стиль_ответов/v4/**'
      - '.github/workflows/client-dialogue-context.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Зависимости CPU
        working-directory: Стиль_ответов
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Дообучение и контрольные ответы
        working-directory: Стиль_ответов
        env:
          HF_HUB_DISABLE_XET: '1'
        run: |
          cd v4
          python prepare.py
          python -u ../run.py
      - uses: actions/upload-artifact@v4
        with:
          name: client-dialogue-context-v4
          path: Стиль_ответов/v4/result
          if-no-files-found: error
