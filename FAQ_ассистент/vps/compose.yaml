services:
  portfolio:
    build:
      context: ..
      dockerfile: vps/Dockerfile
    ports:
      - "127.0.0.1:${PORTFOLIO_PORT:-18241}:8080"
    volumes:
      - portfolio-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  portfolio-data:
