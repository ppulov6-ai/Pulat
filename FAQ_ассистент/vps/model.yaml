services:
  portfolio:
    environment:
      MODEL_URL: http://dialogue:8090/generate
    networks:
      dialogue_net: {}
    depends_on:
      dialogue:
        condition: service_healthy
  dialogue:
    build:
      context: ./model
    volumes:
      - /home/pulatadmin/pulat-model/adapter:/adapter:ro
    networks: [dialogue_net]
    mem_limit: 1300m
    cpus: 1
    restart: unless-stopped
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
networks:
  dialogue_net:
    internal: true
